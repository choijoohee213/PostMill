services:
  - type: web
    name: postmill
    runtime: go
    plan: free
    # DB(Neon)와 같은 지역에 둔다. 페이지 한 번에 DB를 여러 번 오가므로
    # 서버-DB 거리가 사용자-서버 거리보다 체감에 크게 영향을 준다.
    region: ohio
    buildCommand: go build -o postmill .
    startCommand: ./postmill
    # main에 머지되면 자동으로 다시 빌드한다. 기본값이지만 명시해 둔다.
    autoDeploy: true
    # healthCheckPath를 두지 않는다. 주기적인 헬스 체크가 인바운드 트래픽으로
    # 잡히면 무료 인스턴스가 잠들지 않아 월 750시간 한도를 다 써버릴 수 있다.
    envVars:
      - key: GO_VERSION
        value: "1.26.5"
      # 아래 값들은 Render 대시보드에서 직접 입력한다.
      # sync: false 는 blueprint에 값을 적지 않겠다는 뜻이다.
      - key: DATABASE_URL
        sync: false
      # 쉼표로 여러 개를 넣을 수 있다. 한도는 프로젝트 단위라 키마다 프로젝트가 달라야 한다.
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # 저장한 제휴 키를 잠그는 열쇠. 바꾸면 저장해 둔 키를 열 수 없어
      # 사용자가 다시 넣어야 한다.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: THREADS_APP_ID
        sync: false
      - key: THREADS_APP_SECRET
        sync: false
