{{template "head_plain" .}}

<div class="login-box">
  <h1 class="hero-title">PostMill</h1>
  <p class="hero-sub">Threads에 올릴 제휴 글을 AI가 만들고, 검수해서 게시합니다.</p>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form class="form" method="post" action="/login/token">
    <label class="field">
      <span class="label">액세스 토큰</span>
      <textarea name="token" rows="4" placeholder="TH..." required autofocus></textarea>
      <span class="hint">토큰은 관리자에게 문의하세요.</span>
    </label>
    <div class="actions">
      <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </div>
  </form>

  <p class="hint login-note">한 번 로그인하면 이 기기에서는 다시 할 일이 없습니다.</p>

  {{if .Admin}}
  <details class="fallback">
    <summary>관리자 로그인</summary>
    <p class="hint">초안을 만들고 다듬을 수 있습니다. Threads 게시는 토큰으로 로그인해야 합니다.</p>
    <form class="form" method="post" action="/login/admin">
      <label class="field">
        <span class="label">비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <div class="actions">
        <button class="btn" type="submit">관리자로 로그인</button>
      </div>
    </form>
  </details>
  {{end}}

  {{if .DevLogin}}
  <form method="post" action="/login/dev" class="dev-login">
    <button class="btn btn-small" type="submit">개발용 로그인 (로컬 전용)</button>
  </form>
  {{end}}
</div>

{{template "foot" .}}
