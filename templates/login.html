{{template "head_plain" .}}

<div class="login-box">
  <h1 class="hero-title">PostMill</h1>
  <p class="hero-sub">Threads에 올릴 제휴 글을 AI가 만들고, 검수해서 게시합니다.</p>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form class="form" method="post" action="/login/token">
    <label class="field">
      <span class="label">액세스 토큰</span>
      <textarea name="token" rows="4" placeholder="TH..." required autofocus></textarea>
    </label>
    <div class="actions">
      <button class="btn btn-primary btn-block" type="submit">로그인</button>
    </div>
  </form>

  <p class="hint login-note">한 번 로그인하면 이 기기에서는 다시 할 일이 없습니다.</p>

  {{if .DevLogin}}
  <form method="post" action="/login/dev" class="dev-login">
    <button class="btn btn-small" type="submit">개발용 로그인 (로컬 전용)</button>
  </form>
  {{end}}
</div>

{{template "foot" .}}
