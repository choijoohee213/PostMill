{{template "head_plain" .}}

<div class="hero">
  <h1 class="hero-title">PostMill</h1>
  <p class="hero-sub">Threads에 올릴 제휴 글을 AI가 만들고, 검수해서 게시합니다.</p>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form method="post" action="/login/start">
    <button class="btn btn-primary btn-block" type="submit">Threads로 로그인</button>
  </form>

  <form method="post" action="/login/start" class="switch-form">
    <input type="hidden" name="switch" value="1">
    <button class="btn btn-block" type="submit">다른 계정으로 로그인</button>
  </form>
  <p class="hint">비밀번호는 Threads 화면에서 입력하고, 이 앱은 보지 않습니다.</p>

  {{if .DevLogin}}
  <form method="post" action="/login/dev" class="dev-login">
    <button class="btn btn-small" type="submit">개발용 로그인 (로컬 전용)</button>
  </form>
  <p class="hint">Meta가 http 페이지의 로그인을 막아 로컬에서는 Threads 로그인이 되지 않습니다.</p>
  {{end}}
</div>

{{template "foot" .}}
