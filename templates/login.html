{{template "head_plain" .}}

<div class="hero">
  <h1 class="hero-title">PostMill</h1>
  <p class="hero-sub">스레드 제휴 글을 만들고 검수해서 발행합니다.</p>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form method="post" action="/login/start">
    <button class="btn btn-primary btn-block" type="submit">스레드로 로그인</button>
  </form>
  <p class="hint">비밀번호는 스레드 화면에서 입력하고, 이 앱은 보지 않습니다.</p>
</div>

{{template "foot" .}}
