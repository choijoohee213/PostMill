{{template "head" .}}

<h1 class="page-title">설정</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<section class="panel">
  <h2 class="panel-title">스레드 계정</h2>
  {{if .Username}}
    <p class="panel-status">@{{.Username}}</p>
    <p class="hint">토큰 만료 {{.ExpiresAt}}. 만료가 가까워지면 접속할 때 자동으로 갱신됩니다.</p>
  {{else}}
    <p class="panel-status panel-status-off">계정 정보를 찾을 수 없습니다</p>
    <p class="hint">로그아웃 후 다시 로그인해주세요.</p>
  {{end}}
</section>

<section class="panel">
  <h2 class="panel-title">계정</h2>
  <div class="secondary-actions">
    <form method="post" action="/logout">
      <button class="btn" type="submit">로그아웃</button>
    </form>
    <form method="post" action="/disconnect"
          onsubmit="return confirm('연결을 해제하면 저장된 토큰이 지워지고 로그아웃됩니다. 계속할까요?')">
      <button class="btn btn-danger" type="submit">연결 해제</button>
    </form>
  </div>
</section>

{{template "foot" .}}
