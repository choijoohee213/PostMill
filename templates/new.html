{{template "head" .}}

<h1 class="page-title">초안 만들기</h1>

{{if .Error}}<p class="error">{{.Error}}</p>{{end}}

<form class="form" method="post" action="/new">
  <fieldset class="field">
    <legend>제휴사</legend>
    <div class="choices">
      {{range $.Affiliates}}
      <label class="choice">
        <input type="radio" name="affiliate" value="{{.Key}}"{{if eq .Key $.Form.Affiliate}} checked{{end}}>
        <span>{{.Label}}</span>
      </label>
      {{end}}
    </div>
  </fieldset>

  <div class="field">
    <label class="label" for="affiliate_link">제휴 링크</label>
    <input type="url" id="affiliate_link" name="affiliate_link" value="{{.Form.AffiliateLink}}"
           placeholder="https://" inputmode="url" required>

    {{/* 선택한 제휴사의 것만 보인다. 자바스크립트가 없으면 둘 다 보이고,
         그래도 링크를 붙여넣는 데는 지장이 없다. */}}
    {{range $.Affiliates}}
    <div class="link-help" data-aff-help="{{.Key}}"{{if ne .Key $.Form.Affiliate}} hidden{{end}}>
      <a class="btn btn-small" href="{{.HelpURL}}" target="_blank" rel="noopener">{{.HelpLabel}} ↗</a>
      <span class="hint">{{.HelpHint}}</span>
    </div>
    {{end}}
  </div>

  <label class="field">
    <span class="label">상품 페이지 <em>(선택)</em></span>
    <input type="url" name="product_url" value="{{.Form.ProductURL}}" placeholder="https://" inputmode="url">
  </label>

  <label class="field">
    <span class="label">상품 메모</span>
    <textarea name="memo" rows="6" required
              placeholder="어떤 상품인지, 어떤 점이 좋았는지, 원하는 톤을 적어주세요.">{{.Form.Memo}}</textarea>
    <span class="hint">여기 적은 내용만 글에 들어갑니다. 적지 않은 가격이나 수치는 지어내지 않습니다.</span>
  </label>

  <div class="actions">
    <a class="btn btn-ghost" href="/">취소</a>
    <button class="btn btn-primary" type="submit">초안 만들기</button>
  </div>
</form>

{{template "foot" .}}
